name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 3.10 too, or the tests of the helper on its 3.10 floor skip
      - name: Set up Python 3.10 and 3.14
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14

      # standard library only, but the tests import the package from src
      - name: Install
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest
