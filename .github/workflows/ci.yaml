name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 3.10 too, or the tests of the helper on its 3.10 floor skip
      - name: Set up Python 3.10 and 3.14
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14

      # standard library only, but the tests import the package from src
      - name: Install
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest

  # every run builds, so a branch push proves the package before any tag
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # a full version: setup-uv publishes no major tag after v7
      - uses: astral-sh/setup-uv@v10.3.2

      # PyPI never takes a version twice, so a mismatched tag must not upload
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # the same file lives in the private repo, so only the public one publishes
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'east-van-ai/hello-127'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
