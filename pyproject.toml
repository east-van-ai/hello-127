[project]
name = "hello-127"
version = "0.2.0"
description = "Carry TCP over a container's standard streams to a service on the Mac's loopback"
readme = "README.md"
authors = [
    { name = "Go Nakamaru" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: MacOS"]
dependencies = []

[project.urls]
Repository = "https://github.com/east-van-ai/hello-127"
Changelog = "https://github.com/east-van-ai/hello-127/blob/main/CHANGELOG.md"

[project.scripts]
hello-127 = "hello_127.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
