name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 3.10 too, or the tests of the helper on its 3.10 floor skip
      - name: Set up Python 3.10 and 3.14
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14

      # the JavaScript helper's floor, not whatever node the runner carries
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # the PHP helper's floor; no tools or coverage, since the tests run php -r alone
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      # the Ruby helper's floor; Minitest comes with it as a bundled gem
      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # the Perl helper's floor; Test::More comes with it
      - name: Set up Perl 5.34
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.34'

      # standard library only, but the tests import the package from src
      - name: Install
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest

  # Ubuntu's busybox cuts nc down, so the BusyBox tests run in Alpine, through
  # docker run, since GitHub's JavaScript actions do not run on Alpine's musl
  busybox:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run tests in python:3.14-alpine
        run: >-
          docker run --rm -v "$PWD":/src -w /src -e PYTHONDONTWRITEBYTECODE=1
          python:3.14-alpine sh -c
          'pip install -q --root-user-action=ignore -e . && python -m unittest'

  # every run builds, so a branch push proves the package before any tag
  build:
    needs: [test, busybox]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # a full version: setup-uv publishes no major tag after v7
      - uses: astral-sh/setup-uv@v10.3.2

      # PyPI never takes a version twice, so a mismatched tag must not upload
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # the same file lives in the private repo, so only the public one publishes
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'east-van-ai/hello-127'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
